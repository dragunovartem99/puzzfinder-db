name: CI

on:
    pull_request:
        branches: ["main"]

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Build image
              run: docker compose build init

            - name: Apply schema
              run: docker compose run --rm --entrypoint duckdb init :memory: -f sql/schema.sql
